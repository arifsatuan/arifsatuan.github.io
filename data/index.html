<!DOCTYPE html>
<html lang="en">

      { no: 10, isian: "Bank DKI", data: "12728001221", file: "https://...buku_tabungan_DKI..." },
      { no: 11, isian: "SD Muh Tlogoglelo", data: "II.4/F/2003./16 | 14-06-2003", file: "" },
      { no: 12, isian: "SMPN 2 TEMON", data: "DN-04 Dl 0965005 | 26-06-2006", file: "" },
      { no: 13, isian: "SMAN 2 WATES", data: "DN-04 Ma 0004056 | 13-06-2009", file: "" }
    ];

    const catatan = [
      { no: 1, name: "MUNASRIYATI", nik: "3306044611650001" },
      { no: 2, name: "WASIL", nik: "3306041011660001" },
      { no: 3, name: "RIYAN HERMAWAN", nik: "3306041611970001" },
      { no: 4, name: "ACHMAD BASRI PRAWIJI", nik: "3301031009630001" },
      { no: 5, name: "SRI WARSINI", nik: "3301034707660002" },
      { no: 6, name: "ASA SHANDERIA KIREINA", nik: "3301035710230002" },
      { no: 7, name: "WARTITI", nik: "3174056709690003" },
      { no: 8, name: "HAYCAL SETIA TAMA", nik: "3174052206980002" },
      { no: 9, name: "AFAN NURRAHMATULLAH", nik: "3174050505650001" }
    ];

    const resi = [
  { no: 1, isian: "No. KK", data: "3301030403190007", file: "https://sites.google.com/site/arifstwangr/home/KK_arif_Setiawan_pass.pdf?attredirects=0&d=1" },
  { no: 2, isian: "NIK", data: "3301035205910002", file: "https://sites.google.com/site/arifstwangr/home/KTP_RESI_pass.pdf?attredirects=0&d=1" },
  { no: 3, isian: "NPWP", data: "663869261522000", file: "https://sites.google.com/site/arifstwangr/home/NPWP_Kharisma_pass.pdf?attredirects=0&d=1" },
  { no: 4, isian: "No Serdik", data: "001038178420210255", file: "https://sites.google.com/site/arifstwangr/home/Serdik_Resi_pass.pdf?attredirects=0&d=1" },
  { no: 5, isian: "NRG", data: "211801125423", file: "" },
  { no: 6, isian: "NUPTK", data: "8844769670230282", file: "" },
  { no: 7, isian: "Passport", data: "X5072577", file: "" },
  { no: 8, isian: "No Ijazah S1", data: "57484/0212/F05/S1/2014", file: "https://sites.google.com/site/arifstwangr/home/S1-IJAZAH_KHARISMA_MEI_R_pass.pdf?attredirects=0&d=1" },
  { no: 9, isian: "No Rek DKI", data: "537.23.28319.1", file: "https://sites.google.com/site/arifstwangr/home/rekening_DKI_resi_pass.pdf?attredirects=0&d=1" },
  { no: 10, isian: "No_Akta_Nikah", data: "0189/38/III/2018", file: "https://sites.google.com/site/arifstwangr/home/Akta_Nikah_pass.pdf?attredirects=0&d=1" }
];


    function renderTable(tableId, data, headers) {
      const table = document.getElementById(tableId);
      let thead = "<thead><tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr></thead>";
      let tbody = "<tbody>";
      data.forEach(row => {
        tbody += "<tr>";
        headers.forEach(h => {
          if (h.toLowerCase() === "file") {
            const url = row.file || "#";
            const label = url === "#" ? "-" : "Link";
            tbody += `<td>${url === "#" ? "-" : `<a href="${url}" target="_blank">${label}</a>`}</td>`;
          } else {
            tbody += `<td>${row[h.toLowerCase()] || ""}</td>`;
          }
        });
        tbody += "</tr>";
      });
      tbody += "</tbody>";
      table.innerHTML = thead + tbody;
    }

    function toggleCatatan() {
      const div = document.getElementById("catatanDiv");
      div.style.display = div.style.display === "block" ? "none" : "block";
    }

    // Render tables
    renderTable("dataIsianTable", dataIsian, ["No", "Isian", "Data", "File"]);
    renderTable("catatanTable", catatan, ["No", "Name", "NIK"]);
    renderTable("resiTable", resi, ["No", "Isian", "Data", "File"]);
  </script>
</body>
</html>
